# What: GitHub Actions pipeline for this repo: lint + header check + types + tests on Node 22/24,
#     dogfood clean-core gates, secret and dependency scans.
# Why: Every change is verified automatically, and the accelerators are run against their own
#     reference output.
# If missing or unlinked: Nothing runs on push/PR; broken tools, leaked secrets and vulnerable
#     dependencies can be merged unnoticed.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  dogfood:
    name: clean-core gates on generated and reference code
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint generated RAP example (ABAP clean core)
        run: npx abap-policy-lint packages/rap-scaffold/examples/out --format sarif --out abap.sarif
      - name: Lint CAP reference app
        run: npx cap-policy-lint reference-apps/cap-sales-order --format sarif --out cap.sarif
      - name: Central gate
        run: npx sapdx-gate abap.sarif cap.sarif --out merged.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('merged.sarif') != ''
        with:
          sarif_file: merged.sarif
          category: sapdx-gate

  security:
    name: secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
