# What: GitHub Actions pipeline for this repo: lint + header check + types + tests on Node 22/24,
#     dogfood clean-core gates, secret and dependency scans.
# Why: Every change is verified automatically, and the accelerators are run against their own
#     reference output.
# If missing or unlinked: Nothing runs on push/PR; broken tools, leaked secrets and vulnerable
#     dependencies can be merged unnoticed.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  reference-app:
    name: generated CAP reference app passes its own gates (Node 24)
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate and compare with the committed reference app
        run: |
          node packages/create-cap-app/bin/create-cap-app.js sales-orders --dir "$RUNNER_TEMP" --sapdx-source . --skip-install
          diff -r --exclude=package.json --exclude=package-lock.json --exclude=node_modules "$RUNNER_TEMP/sales-orders" reference-apps/sales-orders
      - name: Install reference app
        run: npm ci
        working-directory: reference-apps/sales-orders
      - name: Lint, test and policy gate inside the reference app
        run: npm run check
        working-directory: reference-apps/sales-orders
      - name: CAP policy findings as SARIF
        if: always()
        run: node packages/cap-policy-lint/bin/cap-policy-lint.js reference-apps/sales-orders --format sarif --out cap.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('cap.sarif') != ''
        with:
          sarif_file: cap.sarif
          category: cap-reference-app

  rap-example:
    name: RAP generator output is reproducible and verified
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate (with abaplint verification) and compare with the committed example
        run: |
          node packages/rap-scaffold/bin/rap-scaffold.js --model packages/rap-scaffold/examples/sales-order.yaml --out "$RUNNER_TEMP/rap"
          diff -r "$RUNNER_TEMP/rap" packages/rap-scaffold/examples/out

  security:
    name: secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
