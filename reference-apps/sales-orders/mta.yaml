# What: Multi-target application descriptor for Cloud Foundry: srv module, database deployer and
#     BTP service instances (XSUAA, HANA/Postgres, destination, logging).
# Why: Created by cds add mta/hana/xsuaa/destination/application-logging so deployment stays
#     aligned with SAP tooling.
# If missing or unlinked: mbt build and cf deploy fail; service bindings are not created.

_schema-version: 3.3.0
ID: sales-orders
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: sales-orders-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: sales-orders-auth
      - name: sales-orders-db
      - name: sales-orders-destination
      - name: sales-orders-logging

  - name: sales-orders-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sales-orders-db

resources:
  - name: sales-orders-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sales-orders-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: sales-orders-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: sales-orders-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: sales-orders-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: standard
